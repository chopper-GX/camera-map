<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALPR map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0e1116;overflow:hidden;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#e8ecf2;-webkit-font-smoothing:antialiased}
  #map{position:absolute;inset:0}

  /* live count, top right */
  #count{position:absolute;right:22px;top:18px;z-index:3;text-align:right;
    text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);pointer-events:none}
  #count b{display:block;font-size:46px;font-weight:700;letter-spacing:-.025em;line-height:1;
    font-variant-numeric:tabular-nums;color:#ffb838}
  #count span{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#9aa7b8;margin-top:7px}

  /* manufacturer breakdown, bottom left — recomputed for the current view */
  #brands{position:absolute;left:18px;bottom:18px;z-index:3;width:272px;
    background:rgba(10,13,18,.88);border:1px solid rgba(255,255,255,.10);border-radius:9px;
    padding:13px 14px 11px;backdrop-filter:blur(10px)}
  #brands h2{margin:0 0 10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#8a97a8;font-weight:600}
  #brands h2 b{color:#5f6b7b;font-weight:600}
  #stack{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:1.5px;
    background:rgba(255,255,255,.06)}
  #stack u{display:block;height:100%;text-decoration:none;transition:width .3s ease;min-width:1px}
  #list{margin-top:11px}
  .row{display:flex;align-items:center;font-size:12.5px;padding:3.5px 0}
  .row s{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-right:8px;
    text-decoration:none}
  .row em{font-style:normal;color:#dbe2ec;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .row i{margin-left:auto;padding-left:10px;font-style:normal;color:#93a0b1;
    font-variant-numeric:tabular-nums;font-size:12px}
  .row.none{color:#6c7887}
  #credit{margin:11px 0 0;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);
    font-size:10px;line-height:1.45;color:#697484}
  #credit a{color:#8b98a9}

  #loading{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:#0e1116;color:#7b8797;font-size:13px}
  /* hover card — one camera, the way the OSM record has it */
  .maplibregl-popup{will-change:transform}
  .maplibregl-popup-content{background:rgba(18,22,29,.97);color:#e8ecf2;
    border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:11px 13px 10px;
    font-size:12.5px;line-height:1.45;box-shadow:0 10px 34px rgba(0,0,0,.6)}
  .maplibregl-popup-tip{border-top-color:rgba(18,22,29,.97)!important;
    border-bottom-color:rgba(18,22,29,.97)!important}
  .tip-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;
    margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.09)}
  .tip-h s{width:8px;height:8px;border-radius:50%;flex:0 0 auto;text-decoration:none}
  .tip-r{display:flex;gap:14px;margin-top:3px}
  .tip-r em{font-style:normal;color:#7d8a9c;flex:0 0 74px;font-size:11.5px}
  .tip-r i{font-style:normal;margin-left:auto;text-align:right;color:#dbe2ec;
    max-width:180px;word-break:break-word}
  .tip-r i.dim{color:#6c7887}
  .tip-c{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);
    color:#6c7887;font-size:11px;font-variant-numeric:tabular-nums}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.55}
  .maplibregl-popup{max-width:min(300px,86vw)!important}

  /* the two-finger / ctrl-scroll notice, restyled to match the map */
  .maplibregl-cooperative-gesture-screen{background:rgba(8,11,15,.72);
    backdrop-filter:blur(2px);font-family:inherit}
  .maplibregl-cooperative-gesture-screen div{font-size:14px;letter-spacing:.01em}

  /* ---- phones: the panel goes full width along the bottom, two columns,
          and the zoom buttons come off because pinch already does that ---- */
  @media(max-width:640px){
    #count{right:12px;top:10px}
    #count b{font-size:26px}
    #count span{font-size:9px;letter-spacing:.12em;margin-top:4px}
    /* the legend was eating close to half the screen — everything in it is
       a step smaller and tighter now, and it sits nearer the bottom edge */
    #brands{left:8px;right:8px;bottom:20px;width:auto;padding:9px 10px 8px;
      border-radius:7px}
    #brands h2{margin-bottom:6px;font-size:9px;letter-spacing:.14em}
    #stack{height:5px}
    #list{margin-top:7px;display:grid;grid-template-columns:1fr 1fr;
      column-gap:12px;row-gap:0}
    .row{font-size:10.5px;padding:1.5px 0}
    .row s{width:6px;height:6px;margin-right:6px}
    .row i{padding-left:6px;font-size:10px}
    #credit{margin-top:7px;padding-top:6px;font-size:8px;line-height:1.4}
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group{display:none}
    .tip-r em{flex-basis:66px}
  }
  /* short landscape phones — tighten everything, but the sources line stays;
     it is a licence condition, not decoration */
  @media(max-height:460px){
    #brands{padding:9px 11px 8px;bottom:24px}
    #brands h2{margin-bottom:6px}
    #list{margin-top:7px}
    .row{padding:1.5px 0;font-size:11.5px}
    #credit{margin-top:7px;padding-top:6px;font-size:9px;line-height:1.35}
    #count b{font-size:26px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">Loading…</div>

<div id="count"><b>0</b><span>cameras in view</span></div>

<div id="brands">
  <h2>Manufacturer <b>in view</b></h2>
  <div id="stack"></div>
  <div id="list"></div>
  <p id="credit">Note: DeFlock coverage is volunteer-reported and may be incomplete.<br />
     Sources: <a href="https://deflock.me" target="_blank"
     rel="noopener">DeFlock</a>; <a href="https://www.openstreetmap.org/copyright"
     target="_blank" rel="noopener">OpenStreetMap</a> contributors (ODbL)</p>
</div>

<script src="alpr-data.js"></script>
<script>
/* ===========================================================================
   Automated licence plate readers recorded in OpenStreetMap, United States.
   Every point drawn individually — no clustering — so the shape of the
   network reads at national zoom. Counts update to whatever is on screen.
   =========================================================================== */
/* Amber, brightest for the biggest player in whatever you are looking at.
   Ranks are recomputed for every view, so the colours mean "1st here",
   "2nd here" — not a fixed national league table. */
const RAMP  = ['#ffb838','#e8a02a','#c9821f','#a76717','#834f11'];
const TOP_N = RAMP.length;
const GREY_OTHER   = '#8f9aa8';   // real manufacturers, just not in the top five
const GREY_UNKNOWN = '#4a525e';   // nobody recorded a manufacturer at all

/* MC maps a raw manufacturer string onto the company that owns it, so
   "Flock", "FlockSafety" and "Flock Group Inc." count as one firm. */
const COMPANY = ALPR.C, MC = ALPR.MC;
const coOf = m => (m>=0 && MC[m]>=0) ? MC[m] : -1;

const N = ALPR.P.length;
const LAT = new Float32Array(N), LON = new Float32Array(N), CO = new Int16Array(N);
for(let i=0;i<N;i++){ const p=ALPR.P[i]; LAT[i]=p[0]; LON[i]=p[1]; CO[i]=coOf(p[4]); }

/* p = [lat, lon, oldBucket, operator, manufacturer, zone, mount] — indexes into
   lookup tables, so 135k records stay under 5 MB. c is the company index. */
const features = ALPR.P.map((p,i)=>({
  type:'Feature', properties:{o:p[3],m:p[4],z:p[5],t:p[6],c:CO[i]},
  geometry:{type:'Point',coordinates:[p[1],p[0]]}
}));

/* filled in by tally() — company index → colour for the current view */
let RANK = new Map();
const colourOf = ci => ci<0 ? GREY_UNKNOWN : (RANK.get(ci) || GREY_OTHER);

/* Embedded in an article, a one-finger drag has to scroll the page, not the
   map — otherwise a reader on a phone gets stuck on the map and cannot get
   past it. Two fingers move the map instead. On the page's own URL there is
   nothing to scroll past, so it behaves normally. */
const EMBEDDED = window.top !== window.self;

const map = new maplibregl.Map({
  container:'map',
  style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center:[-95.8,38.6], zoom:4.05, minZoom:1, maxZoom:19,
  attributionControl:{compact:true},
  cooperativeGestures:EMBEDDED,
  dragRotate:false, pitchWithRotate:false
});
map.touchZoomRotate.disableRotation();   // pinch zooms, it does not spin the map
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');

/* ---------------------------------------------------------------------------
   A fixed opening zoom cannot work on both a desktop window and a phone held
   upright: 4.05 frames the country on one and lands somewhere in Nebraska on
   the other. So the opening view is computed from the country's bounds and
   the space actually available, and that same zoom becomes the floor — you
   can go in, you cannot pull back past the whole map. Recomputed on rotate.
   --------------------------------------------------------------------------- */
const US_BOUNDS = [[-125.5, 23.5], [-66.2, 49.8]];

function framePadding(){
  const panel = document.getElementById('brands');
  const small = innerWidth <= 640;
  const gutter = small ? 14 : 26;
  /* on a phone the panel is a full-width band along the bottom, so the map has
     to be pushed up above it or half the country hides behind the legend */
  const bottom = small
    ? Math.min(innerHeight * 0.42, (panel ? panel.offsetHeight : 150) + 34)
    : 34;
  return {top: small ? 74 : 34, bottom, left: gutter, right: gutter};
}

/* How much room to leave below the opening view. Locking the floor exactly at
   the fitted zoom left no slack at all — the map opened already pressed
   against its own limit, which reads as broken. A phone still wants a tight
   floor, since pulling back there just shrinks the country into a stamp; a
   desktop window has room to spare, so it gets close to a full zoom level. */
const ZOOM_HEADROOM = () => innerWidth <= 640 ? 0.2 : 0.9;

let framed = false;
function frameCountry(recentre){
  const cam = map.cameraForBounds(US_BOUNDS, {padding: framePadding()});
  if(!cam) return;
  const floor = Math.max(0, cam.zoom - ZOOM_HEADROOM());
  map.setMinZoom(floor);
  if(recentre){
    map.jumpTo({center: cam.center, zoom: cam.zoom});
  }
  framed = true;
}

/* the panel has to exist and be laid out before its height can be measured */
addEventListener('load', () => frameCountry(true));
addEventListener('resize', () => frameCountry(!framed));
addEventListener('orientationchange', () => setTimeout(()=>frameCountry(true), 250));

/* rebuilt every time the view settles, from whoever is on top right now */
function colourExpr(){
  const e = ['match',['get','c'], -1, GREY_UNKNOWN];
  RANK.forEach((col,ci)=>{ e.push(ci,col); });
  e.push(GREY_OTHER);
  return e;
}

map.on('load',()=>{
  map.addSource('alpr',{type:'geojson',data:{type:'FeatureCollection',features}});

  /* Two glows, because they do different jobs. The wide one is atmosphere —
     it makes a dense city read as a bloom from far away. The tight one is the
     halo you see up close, hugging each dot. */
  map.addLayer({id:'glow',type:'circle',source:'alpr',
    paint:{
      'circle-color':GREY_OTHER,'circle-blur':1,
      'circle-opacity':['interpolate',['linear'],['zoom'],
                        3,0.16, 6,0.15, 10,0.16, 13,0.22, 16,0.30, 19,0.34],
      'circle-radius':['interpolate',['linear'],['zoom'],
                       3,1.7, 5,2.6, 8,4.6, 12,10, 16,26, 19,46]
    }});
  map.addLayer({id:'halo',type:'circle',source:'alpr',minzoom:9.5,
    paint:{
      'circle-color':GREY_OTHER,'circle-blur':0.75,
      'circle-opacity':['interpolate',['linear'],['zoom'],
                        3,0, 9.5,0, 11,0.22, 13,0.38, 16,0.48, 19,0.52],
      'circle-radius':['interpolate',['linear'],['zoom'],10,4.5, 13,10, 16,18, 19,30]
    }});
  map.addLayer({id:'points',type:'circle',source:'alpr',
    paint:{
      'circle-color':GREY_OTHER,
      'circle-opacity':['interpolate',['linear'],['zoom'],3,0.88,6,0.92,12,1],
      /* Low zoom stays small on purpose — at national scale the shape of the
         network is the story, and fat dots merge into a blob. The growth is
         all in the middle, where you are looking at one town. */
      'circle-radius':['interpolate',['linear'],['zoom'],
                       3,0.55, 4,0.72, 5,0.95, 7,1.6, 10,3.3, 13,5.4, 16,9, 19,14],
      /* a pale rim at street level, the way the original reads */
      'circle-stroke-width':['interpolate',['linear'],['zoom'],10,0, 13,1.1, 19,2],
      'circle-stroke-color':'rgba(255,255,255,.55)'
    }});

  /* ring drawn around whichever camera the cursor is on */
  map.addSource('hover',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'hover-ring',type:'circle',source:'hover',
    paint:{
      'circle-color':'rgba(0,0,0,0)','circle-stroke-color':'#ffffff',
      'circle-stroke-width':1.6,'circle-stroke-opacity':.9,
      'circle-radius':['interpolate',['linear'],['zoom'],3,5,8,7.5,13,13,19,22]
    }});

  document.getElementById('loading').remove();
  frameCountry(true);
  tally();
  wireHover();
});

/* --- hover card ----------------------------------------------------------- */
function wireHover(){
  const tip = new maplibregl.Popup({
    closeButton:false, closeOnClick:false, offset:11,
    maxWidth:'300px', anchor:undefined
  });
  const hoverSrc = map.getSource('hover');
  let shownId = null, pinned = false;

  const look = (tbl,i) => (i>=0 && tbl && tbl[i]) ? tbl[i] : null;
  const row = (label,val) =>
    '<div class="tip-r"><em>'+label+'</em><i'+(val?'':' class="dim"')+'>'+
    (val ? esc(val) : 'Unknown')+'</i></div>';
  const esc = s => String(s).replace(/[&<>"]/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* OSM writes these as street_lamp, traffic — read them as English */
  const pretty = s => s && s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

  function show(f, key){
    if(key === shownId) return;
    shownId = key;
    const p = f.properties;
    const c = f.geometry.coordinates;
    /* the real manufacturer name, not the colour bucket — so a dot that is
       grey because it fell into "Other" still tells you it is a Leonardo */
    const man = look(ALPR.M, p.m);
    tip.setLngLat(c).setHTML(
      '<div class="tip-h"><s style="background:'+colourOf(p.c)+'"></s>ALPR camera</div>'+
      row('Made by',      man)+
      row('Operated by',  look(ALPR.O, p.o))+
      row('Zone',         pretty(look(ALPR.Z, p.z)))+
      row('Mount',        pretty(look(ALPR.T, p.t)))+
      '<div class="tip-c">'+c[1].toFixed(5)+', '+c[0].toFixed(5)+'</div>'
    ).addTo(map);
    hoverSrc.setData({type:'FeatureCollection',features:[
      {type:'Feature',properties:{},geometry:{type:'Point',coordinates:c}}]});
  }
  function hide(){
    if(pinned) return;
    shownId = null; tip.remove();
    hoverSrc.setData({type:'FeatureCollection',features:[]});
  }

  /* A dot at national zoom is under half a pixel wide, so pointing at one
     exactly is impossible. Search a square around the cursor and take the
     nearest camera in it. A finger is blunter than a mouse, so it gets a
     bigger square. This used to be an invisible extra circle layer, which
     cost a phone another 135,000 circles per frame for nothing. */
  const TOUCH = matchMedia('(pointer:coarse)').matches;
  const grab  = () => {
    const z = map.getZoom();
    const r = z < 6 ? 6 : z < 10 ? 8 : 11;
    return TOUCH ? r + 7 : r;
  };
  function pick(pt){
    const r = grab();
    const hits = map.queryRenderedFeatures(
      [[pt.x-r, pt.y-r],[pt.x+r, pt.y+r]], {layers:['points']});
    let best = null, bd = Infinity;
    for(const f of hits){
      const p = map.project(f.geometry.coordinates);
      const d = (p.x-pt.x)*(p.x-pt.x) + (p.y-pt.y)*(p.y-pt.y);
      if(d < bd){ bd = d; best = f; }
    }
    return best;
  }

  let raf = 0;
  map.on('mousemove', e=>{
    if(pinned || TOUCH || raf) return;
    raf = requestAnimationFrame(()=>{
      raf = 0;
      const f = pick(e.point);
      map.getCanvas().style.cursor = f ? 'pointer' : '';
      if(f) show(f, f.geometry.coordinates.join(',')); else hide();
    });
  });
  map.on('mouseout',()=>{ map.getCanvas().style.cursor=''; hide(); });

  /* touch has no hover, so a tap pins the card until you tap somewhere else */
  map.on('click', e=>{
    const f = pick(e.point);
    if(f){
      pinned = false; shownId = null;
      show(f, f.geometry.coordinates.join(','));
      pinned = TOUCH;
    } else {
      pinned = false; hide();
    }
  });
  map.on('movestart',()=>{ pinned=false; hide(); });
}

/* --- everything below counts what is currently on screen ------------------ *
 * The ranking is per view, not national. Zoom into Manhattan and the top of
 * the list becomes Leonardo and Ekin, because that is who is actually there.
 * ------------------------------------------------------------------------- */
const countEl = document.querySelector('#count b');
const stackEl = document.getElementById('stack');
const listEl  = document.getElementById('list');
const tallies = new Int32Array(COMPANY.length);

function tally(){
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  tallies.fill(0);
  let total = 0, unknown = 0;
  for(let i=0;i<N;i++){
    const la = LAT[i]; if(la<s || la>n) continue;
    const lo = LON[i]; if(lo<w || lo>e) continue;
    total++;
    const ci = CO[i];
    if(ci < 0) unknown++; else tallies[ci]++;
  }
  countEl.textContent = total.toLocaleString();

  /* top five companies in view; unknowns are kept out of the ranking so the
     five slots always go to firms that someone actually named */
  const ranked = [];
  for(let ci=0;ci<tallies.length;ci++) if(tallies[ci]) ranked.push([ci,tallies[ci]]);
  ranked.sort((a,b)=>b[1]-a[1]);
  const top = ranked.slice(0,TOP_N);

  RANK = new Map(top.map(([ci],i)=>[ci,RAMP[i]]));
  if(map.getLayer('points')){
    const col = colourExpr();
    /* the glow takes its colour from the dot, so an unrecorded camera
       does not sit there radiating amber it has not earned */
    ['glow','halo','points'].forEach(id=>map.setPaintProperty(id,'circle-color',col));
  }

  const namedTop = top.reduce((a,[,v])=>a+v,0);
  const others   = total - unknown - namedTop;
  const rows = top.map(([ci,v])=>({label:COMPANY[ci], v, col:RAMP[top.findIndex(t=>t[0]===ci)]}));
  if(others)  rows.push({label:(ranked.length-top.length)+' others', v:others,  col:GREY_OTHER});
  if(unknown) rows.push({label:'Unknown',                            v:unknown, col:GREY_UNKNOWN});

  const pct = v => total ? (100*v/total) : 0;
  stackEl.innerHTML = rows.map(r=>
    '<u style="background:'+r.col+';width:'+pct(r.v).toFixed(2)+'%"></u>').join('');
  listEl.innerHTML = total ? rows.map(r=>
    '<div class="row"><s style="background:'+r.col+'"></s>'+
    '<em>'+r.label+'</em><i>'+Math.round(pct(r.v))+'%</i></div>').join('')
    : '<div class="row none">Nothing in view</div>';
}

let t=null;
map.on('move',()=>{ if(t) return; t=setTimeout(()=>{t=null;tally();},90); });
map.on('moveend',tally);
</script>
</body>
</html>
